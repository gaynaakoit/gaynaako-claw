version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SUPER_STRONG_PASSWORD
      POSTGRES_DB: gaynaako
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - app-network

  backend:
    image: warriorkod/gaynaako-claw-backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://postgres:SUPER_STRONG_PASSWORD@postgres:5432/gaynaako
      REDIS_HOST: redis
    networks:
      - app-network
    ports:
      - "3000:3000"
    # ⚡ Commande qui attend que Postgres et Redis soient prêts avant de lancer NestJS
    entrypoint: ["/bin/sh", "-c", "
      apk add --no-cache bash curl;
      until nc -z postgres 5432; do echo 'Waiting for Postgres...'; sleep 2; done;
      until nc -z redis 6379; do echo 'Waiting for Redis...'; sleep 2; done;
      echo 'Dependencies ready, starting NestJS...';
      node dist/main.js
    "]

  frontend:
    image: warriorkod/gaynaako-claw-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network
    ports:
      - "8080:80"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: