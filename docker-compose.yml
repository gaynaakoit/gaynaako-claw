version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SUPER_STRONG_PASSWORD
      POSTGRES_DB: gaynaako
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

  backend:
    build: ./backend/gaynaako-claw-backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://postgres:SUPER_STRONG_PASSWORD@postgres:5432/gaynaako
      REDIS_HOST: redis
    networks:
      - app-network
    expose:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend/gaynaako-claw-frontend
      target: prod
    depends_on:
      - backend
    networks:
      - app-network
    expose:
      - "8080:80" 

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: