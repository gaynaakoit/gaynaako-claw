name: Deploy to Vultr

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🔹 Build backend image
      - name: Build and push backend Docker image
        run: |
          docker build -t gaynaako-claw-backend:latest ./backend/gaynaako-claw-backend
          docker tag gaynaako-claw-backend:latest ${{ secrets.DOCKER_USERNAME }}/gaynaako-claw-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/gaynaako-claw-backend:latest

      # 🔹 Build frontend image (Angular)
      - name: Build and push frontend Docker image
        run: |
          docker build -t gaynaako-claw-frontend:latest ./frontend/gaynaako-claw-frontend
          docker tag gaynaako-claw-frontend:latest ${{ secrets.DOCKER_USERNAME }}/gaynaako-claw-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/gaynaako-claw-frontend:latest

      # 🔹 Deploy on Vultr
      - name: Deploy on Vultr
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30m
          script: |
            cd /root/gaynaako-claw
            git reset --hard
            git clean -fd
            git pull origin main

            # Pull images déjà construites
            docker pull ${{ secrets.DOCKER_USERNAME }}/gaynaako-claw-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/gaynaako-claw-frontend:latest

            # Stop & rebuild containers
            docker compose down
            docker compose up -d --build

            # Vérification rapide
            docker compose ps
            docker compose logs --tail=50

            # 🔹 Optionnel : Reload Nginx pour reverse proxy si config changée
            if systemctl is-active --quiet nginx; then
              systemctl reload nginx
            fi